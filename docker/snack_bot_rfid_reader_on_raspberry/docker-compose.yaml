name: raspberry_snack_bot_rfid_reader

services:
  raspberry_snack_bot_rfid_reader:
    image: eduartrobotik/eduart-perception:0.5.0
    container_name: raspberry_snack_bot_rfid_reader-0.5.0
    user: user
    privileged: true
    ipc: host
    pid: host
    environment:
        - EDU_ROBOT_NAMESPACE=${EDU_ROBOT_NAMESPACE}
        - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION}
        - CYCLONEDDS_URI=/home/user/ros/launch_content/cyclone_dds_profile.xml
        - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
    network_mode: "host"
    devices:
        - '/dev:/dev'
    command: bash -c 'cd /home/user/ros/launch_content; source /home/user/rfid_venv/bin/activate; ros2 launch pf_rfid_reader.launch.py'
    volumes:
        - './launch_content:/home/user/ros/launch_content:r'
